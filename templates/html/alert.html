<!-- alert.html -->

  <div class="notification-container">
    <div class="notif-icon" id="notifIcon">
      <span class="material-symbols-sharp">notifications</span>
      <span class="notif-ping" id="notifPing"></span>
    </div>
    <div class="notification-box" id="notificationBox" style="display: none;">
      <h3>System Alerts</h3>
      <div id="notificationCategories"></div>
    </div>
  </div>

<style>
  /* Category styling */
.category {
  margin-bottom: 15px;
  padding: 8px 10px;
  border-radius: 8px;
  background: #f9fafb;
  transition: background 0.2s ease;
}
.category:hover {
  background: #f1f5f9;
}
.category h4 {
  font-size: 15px;
  font-weight: 600;
  margin: 0 0 6px 0;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #222;
}
.category ul {
  max-height: 100px;      /* default collapsed height */
  overflow: hidden;       /* hide extra items */
  transition: max-height 0.3s ease;
}

.category.expanded ul {
  max-height: 200px;      /* expanded height */
  overflow-y: auto;       /* enable vertical scrolling */
  scrollbar-width: thin;  /* optional: thin scrollbar for Firefox */
}

.category.expanded ul::-webkit-scrollbar {
  width: 6px;             /* scrollbar width for WebKit */
}

.category.expanded ul::-webkit-scrollbar-thumb {
  background-color: #ccc; /* scrollbar color */
  border-radius: 3px;
}

.category li {
  padding: 6px 0;
  font-size: 14px;
  color: #444;
  border-bottom: 1px solid #eee;
}
.category li:last-child {
  border-bottom: none;
}

/* View More / View Less */
.view-more {
  display: inline-block;
  font-size: 13px;
  color: #2563eb;
  cursor: pointer;
  margin-top: 6px;
  transition: color 0.2s ease;
}
.view-more:hover {
  text-decoration: underline;
  color: #1d4ed8;
}

/* Notification Icon + Ping */
.notif-icon {
  position: relative;
  display: inline-block;
  cursor: pointer;
  font-size: 26px;
  color: #444;
  transition: color 0.2s ease;
}
.notif-icon:hover {
  color: #2563eb;
}
.notif-ping {
  position: absolute;
  top: 0px;
  right: -2px;
  width: 10px;
  height: 10px;
  background-color: red;
  border-radius: 50%;
  display: none;
  box-shadow: 0 0 5px red;
  animation: ping 1.2s infinite;
}

/* Notification Box */
.notification-container {
  position: relative;
  display: inline-block;
}

/* Notification box aligned properly to bell icon */
.notification-box {
  position: absolute;
  top: 35px;
  right: 0;                  /* keep right edge aligned */
  transform: translateX(10%); /* shift slightly right or left if needed */
  width: 400px;              
  max-height: 420px;
  background-color: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
  padding: 1rem;
  display: none;
  z-index: 999;
  overflow-y: auto;
}

/* Box Header */
.notification-box h3 {
  margin: 0 0 10px 0;
  font-size: 17px;
  font-weight: 700;
  color: #111;
  border-bottom: 1px solid #e5e7eb;
  padding-bottom: 8px;
}

/*  Responsive: make box shrink on mobile */
@media (max-width: 480px) {
  .notification-box {
    width: 90vw;
    right: 5%;
  }
}
@media (max-width: 768px) {

  /* Notification icon — larger touch area */
  .notif-icon {
    font-size: 30px;
    padding: 8px;
  }

  /* Fullscreen overlay for better UX */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    display: none;
    z-index: 998;
  }

  /* Show dim background when box is visible */
  .notification-box[style*="display: block"] ~ body::after {
    display: block;
  }

  /* Notification box — full width and centered on mobile */
  .notification-box {
    position: fixed !important;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 90vw;
    max-width: 420px;
    max-height: 60vh;
    border-radius: 12px;
    padding: 1rem;
    z-index: 9999;
    overflow-y: auto;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  /* Scroll behavior and text spacing */
  .notification-box h3 {
    font-size: 16px;
    text-align: center;
  }

  .category {
    padding: 10px;
    border-radius: 10px;
  }

  .category h4 {
    font-size: 14px;
  }

  .category li {
    font-size: 13px;
  }

  .view-more {
    font-size: 13px;
  }
}

</style>
<script>
async function fetchAllAlertsToBox() {
  try {
    const response = await fetch("/api/all-alerts");
    const data = await response.json();

    console.debug("DEBUG /api/all-alerts response:", data);

    const categoriesContainer = document.getElementById("notificationCategories");
    const ping = document.getElementById("notifPing");

    const expandedCategories = new Set(
      Array.from(document.querySelectorAll(".category.expanded"))
        .map(div => div.getAttribute("data-category"))
    );

    categoriesContainer.innerHTML = "";

    const alertsByCategory = data.alerts;
    const storedAlerts = JSON.parse(localStorage.getItem("seenAlerts")) || [];

    let allAlerts = [];
    let hasNew = false;

    function extractIdFromMessage(msg) {
      if (!msg) return "";
      const patterns = [
        /([A-Z]{2,}-\d{1,6})/,
        /([A-Z]{2,}\d{1,6})/,
        /([A-Z]{1,4}-[A-Z]{1,4}-\d{1,4})/,
        /([A-Z]{2,}\d{2,6})/
      ];
      for (const p of patterns) {
        const m = msg.match(p);
        if (m) return m[1];
      }
      return "";
    }

    for (const [category, alerts] of Object.entries(alertsByCategory)) {
      const categoryDiv = document.createElement("div");
      categoryDiv.classList.add("category");
      categoryDiv.setAttribute("data-category", category);

      const header = document.createElement("h4");
      header.textContent = category;
      categoryDiv.appendChild(header);

      const ul = document.createElement("ul");

      alerts.forEach((alertObj, idx) => {
        allAlerts.push(alertObj.message);

        const li = document.createElement("li");

        const displayTime = alertObj.display_time || alertObj.timestamp;

        const alertIdCandidate =
          (alertObj && (alertObj.material_id || alertObj.materialId || alertObj.id || alertObj.item_id || alertObj.mat_id)) || "";

        const finalId = alertIdCandidate || extractIdFromMessage(String(alertObj.message || ""));

        li.innerHTML = `
          <span class="alert-link" data-id="${finalId}">
            ${alertObj.message}
          </span>
          <span style="float:right; font-size:12px; color:#888;">${displayTime}</span>
        `;

        if (idx >= 1 && !expandedCategories.has(category)) {
          li.style.display = "none";
        }

        ul.appendChild(li);

        const linkEl = li.querySelector(".alert-link");
        linkEl.addEventListener("click", (e) => {
          e.stopPropagation();

          const msg = alertObj.message;
          const id = linkEl.getAttribute("data-id") || "";

          let seen = JSON.parse(localStorage.getItem("seenAlerts")) || [];
          if (!seen.includes(msg)) {
            seen.push(msg);
            localStorage.setItem("seenAlerts", JSON.stringify(seen));
          }

          let hasUnseen = allAlerts.some(a => !seen.includes(a));
          document.getElementById("notifPing").style.display = hasUnseen ? "block" : "none";

          if (id) {
            window.location.href = `/Materials.html?highlight=${encodeURIComponent(id)}`;
          }
        });

        if (!storedAlerts.includes(alertObj.message)) {
          hasNew = true;
        }
      });

      categoryDiv.appendChild(ul);

      if (alerts.length > 1) {
        const viewMore = document.createElement("span");
        viewMore.textContent = expandedCategories.has(category) ? "View Less" : "View More";
        viewMore.classList.add("view-more");

        viewMore.addEventListener("click", () => {
          if (expandedCategories.has(category)) {
            ul.querySelectorAll("li").forEach((li, idx) => {
              if (idx >= 1) li.style.display = "none";
            });
            viewMore.textContent = "View More";
            expandedCategories.delete(category);
            categoryDiv.classList.remove("expanded");
          } else {
            ul.querySelectorAll("li").forEach(li => li.style.display = "list-item");
            viewMore.textContent = "View Less";
            expandedCategories.add(category);
            categoryDiv.classList.add("expanded");
          }
        });

        categoryDiv.appendChild(viewMore);
      }

      categoriesContainer.appendChild(categoryDiv);
    }

    ping.style.display = hasNew ? "block" : "none";

  } catch (error) {
    categoriesContainer.innerHTML =
      "<p style='color: gray;'>Failed to load alerts</p>";
    console.error("Error fetching alerts:", error);
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const notifIcon = document.getElementById("notifIcon");
  const notificationBox = document.getElementById("notificationBox");
  const ping = document.getElementById("notifPing");

  let fetchInterval = null;

  function startInterval() {
    if (!fetchInterval) {
      fetchInterval = setInterval(() => {
        if (notificationBox.style.display !== "block") {
          fetchAllAlertsToBox();
        }
      }, 1000);
    }
  }

  function stopInterval() {
    if (fetchInterval) {
      clearInterval(fetchInterval);
      fetchInterval = null;
    }
  }

  notifIcon.addEventListener("click", (e) => {
    e.stopPropagation();
    const isOpen = notificationBox.style.display === "block";

    if (isOpen) {
      notificationBox.style.display = "none";
      startInterval();
      fetchAllAlertsToBox();
    } else {
      notificationBox.style.display = "block";
      stopInterval();
      ping.style.display = "none";

      // ✅ FIXED: Mark all current alerts as seen using API response
      fetch("/api/all-alerts")
        .then(r => r.json())
        .then(data => {
          const current = [];
          Object.values(data.alerts).forEach(group =>
            group.forEach(a => current.push(a.message))
          );
          localStorage.setItem("seenAlerts", JSON.stringify(current));
        });
    }
  });

  document.addEventListener("click", (e) => {
    const isClickInsideBox = notificationBox.contains(e.target);
    const isClickOnIcon = notifIcon.contains(e.target);

    if (!isClickInsideBox && !isClickOnIcon && notificationBox.style.display === "block") {
      notificationBox.style.display = "none";
      startInterval();
      fetchAllAlertsToBox();
    }
  });

  fetchAllAlertsToBox();
  startInterval();
});
</script>
